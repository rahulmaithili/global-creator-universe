<text x="75" y="980" font-family="Arial" font-size="21" fill="white">USA • UK • UAE • Saudi Arabia • Qatar • Kuwait • Bahrain • Oman</text>
<text x="75" y="1025" font-family="Arial" font-size="20" fill="#dcecff">Primary language: simple English • Optional English subtitles / selected Arabic subtitles</text>
