<text x="75" y="1245" font-family="Arial" font-size="28" font-weight="700" fill="#12365a">GENERATION RULES</text>
<text x="75" y="1290" font-family="Arial" font-size="19" fill="#222">1. Use the approved reference image whenever the generator supports image reference.</text>
<text x="75" y="1325" font-family="Arial" font-size="19" fill="#222">2. Never replace the protagonist or create a duplicate version.</text>
<text x="75" y="1360" font-family="Arial" font-size="19" fill="#222">3. Keep anatomy, hands, skin texture and lighting realistic.</text>
<text x="75" y="1395" font-family="Arial" font-size="19" fill="#222">4. Avoid fabricated identity claims about residence, education or official status.</text>
<text x="75" y="1430" font-family="Arial" font-size="19" fill="#222">5. Check recent concepts before generating the next one to prevent repetition.</text>
<text x="75" y="1475" font-family="Arial" font-size="21" font-weight="700" fill="#12365a">Commands: NEXT VIDEO • NEXT PHOTO • DAILY PACK • SERIES • REMAKE • TREND ADAPT</text>
