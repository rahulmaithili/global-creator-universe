<text x="75" y="195" font-family="Arial" font-size="28" font-weight="700" fill="#12365a">IDENTITY LOCK</text>
<text x="75" y="235" font-family="Arial" font-size="20" fill="#222">Male creator persona • late-20s to early-30s visual appearance</text>
<text x="75" y="270" font-family="Arial" font-size="20" fill="#222">Short black hair • dark brown eyes • medium-brown skin • broad/oval face</text>
<text x="75" y="305" font-family="Arial" font-size="20" fill="#222">Trimmed full beard + neat moustache • natural average-to-solid build</text>
<text x="75" y="340" font-family="Arial" font-size="20" fill="#222">Approachable • curious • funny • adventurous • expressive • relatable</text>
