# Hashtag bank — assembled per SOCIAL/ hashtag rules:
# 1–3 broad + 2–4 niche + 1–2 location (only when genuinely relevant) + 1 brand/series.
# Platform adapters trim counts (IG ~8–12, FB ~3–5, YT ~3–5). No misleading location tags.
